[package]
name = "save-your-documents"
version = "1.0.0"
description = "Save Your Documents: lokales, verschlüsseltes Dokumentenarchiv"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "save_your_documents_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde_json = "1"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
