[project]
name = "save-your-documents"
version = "1.0.0"
description = "Lokales Dokumentenarchiv: Backend (Sidecar)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlcipher3-wheels>=0.5",
    "cryptography>=43",
    "httpx>=0.27",
    "pillow>=10",
    "pillow-heif>=0.18",
    "pypdfium2>=4",
    "python-multipart>=0.0.9",
    "websockets>=12",
]

[project.scripts]
syd = "syd.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["syd", "syd.extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
