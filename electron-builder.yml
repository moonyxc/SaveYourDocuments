appId: com.vynofc.saveyourdocuments
productName: SaveYourDocuments
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
win:
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: SaveYourDocuments
linux:
  target:
    - AppImage
    - zip
  category: Office
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  target:
    - zip
  category: public.app-category.productivity
