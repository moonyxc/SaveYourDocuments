appId: com.saveyourdocuments.app
productName: SaveYourDocuments
directories:
  output: release

asarUnpack:
  - "node_modules/better-sqlite3-multiple-ciphers/**"
  - "node_modules/node-llama-cpp/**"
  - "node_modules/@node-llama-cpp/**"

electronVersion: "28.0.0"

files:
  - "**/*"
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!src/**"
  - "!electron/**"
  - "!.github/**"
  - "!docs/**"
  - "!scripts/**"
  - "!e2e/**"
  - "!resources/**"
  - "!*.md"
  - "!*.yml"
  - "!*.yaml"
  - "!*.sh"
  - "!*.bat"
  - "!tsconfig*.json"
  - "!vite.config.ts"
  - "!vitest.config.ts"
  - "!playwright.config.ts"
  - "!tailwind.config.js"
  - "!postcss.config.js"
  - "!.env*"
  - "!.gitignore"
  - "!.git/**"
  - "!report_*.md"

win:
  target:
    - nsis
    - portable

linux:
  target:
    - AppImage

mac:
  target:
    - dmg

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
