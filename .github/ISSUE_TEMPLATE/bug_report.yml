name: Bug Report
description: Fehlerbericht einreichen
title: "[Bug]: "
labels: ["bug"]
assignees:
  - vynOFC
body:
  - type: dropdown
    id: component
    attributes:
      label: Komponente
      description: Welche Komponente ist betroffen?
      options:
        - Renderer
        - Main
        - OCR
        - Datenbank
        - Packaging
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Beschreibe den Fehler so genau wie möglich.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Umfang
      options:
        - "🟢 small"
        - "🟡 medium"
        - "🔴 big"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduktionsschritte
      description: Schritt-für-Schritt um den Fehler zu reproduzieren.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Welche Version ist betroffen?
    validations:
      required: false