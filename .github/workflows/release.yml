name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Attach (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build (TypeScript)
        run: npm run build

      - name: Package app (zip + installer)
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (zip + installer)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.dmg
          fail_on_unmatched_files: false
